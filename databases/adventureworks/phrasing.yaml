  shapes:
    customer: f'{word(pick([1, 2]))} {word(pick([2, 3]))}' if rand() < 0.6 else value('store')
    territory_group: pick(['North', 'South', 'East', 'West', 'Central']) + ' ' + word()
    model: pick([f'{word()}-{randint(1, 9)}00', f"{word()} {pick(['Frame', 'Helmet', 'Jersey', 'Tire Tube'])}"])
    color: pick(colors)
    yearly_income: f'{(a := pick([10, 20, 40, 60, 80, 120]) * 1000) + 1}-{a + 20000}'
    commute_distance: f'{(a := pick([1, 3, 7, 15]))}-{a * 2} Miles'
    postal_code: f'{randint(10000, 99999)}'
    special_offer: f"{word()} {pick(['Discount', 'Sale', 'Promotion'])} {randint(2, 40)}%"
    job_title: f'{word()} ' + pick(['Specialist', 'Technician', 'Planner', 'Coordinator', 'Supervisor', 'Manager'])
    people: f'{word(pick([1, 2]))} {word(pick([2, 3]))}'
    companies: f'{word()} ' + pick(['Cycles', 'Bike Shop', 'Supply', 'Sports', 'Outfitters', 'Company', 'Inc.', 'Wheelworks', 'Trading', 'Bank', 'Bikes', 'Cycle Store'])
    places: word(pick([2, 3])) + pick(['', '', 'ia', ' Falls', ' Coast', 'land', ' Bay', ' Province'])
    products: pick([f'{word()}-{randint(1, 9)}00 {pick(colors)}, {pick([40, 44, 48, 52, 56, 60])}', f"{word()} {pick(['Crank Arm', 'Hub', 'Saddle', 'Fork', 'Chain Ring', 'Bottle', 'Jacket', 'Tire'])}", f"{pick(['LL', 'ML', 'HL'])} {word()} {pick(['Frame', 'Wheel', 'Pedal', 'Seat'])}"])
    categories: pick([word() + 's', f'{word()} Gear', f'{word()} Parts'])
    named_things: f'{word()} ' + pick(['Operations', 'Assembly', 'Control', 'Support', 'Review', 'Check', 'Guide', 'Bay'])
