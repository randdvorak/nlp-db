# How people ask about AdventureWorks. engine/gen_plans.py reads this to write training questions;
# every key is optional and falls back to generic wording. Nothing here is a database value:
# filter values in training are made up (made_up_values at the end).

# Plurals the simple English rules get wrong.
plural:
  sales person: sales people
  sales rep: sales reps
  staff member: staff
  salesperson: salespeople
  SKU: SKUs
  country: countries
  class: classes

# Question forms per measure; {x} is the rest of the question (filters, time).
ask:
  order_count:
  - how many orders {x}
  - number of orders {x}
  - count the orders {x}
  - how many sales orders were placed {x}
  - order count {x}
  customer_count:
  - how many customers {x}
  - number of customers {x}
  - how many distinct customers bought {x}
  - count of customers {x}
  units_sold: ['how many units were sold {x}', 'units sold {x}', 'total quantity sold {x}', 'how many did we sell {x}']
  po_count: ['how many purchase orders {x}', 'number of purchase orders {x}', 'count of POs {x}']
  work_order_count: ['how many work orders {x}', 'number of work orders {x}']
  product_count:
  - how many products {x}
  - number of products {x}
  - count the products {x}
  - how many items do we have {x}
  headcount: ['how many employees {x}', 'headcount {x}', 'number of staff {x}', 'how many people work {x}']
  vendor_count: ['how many vendors {x}', 'number of suppliers {x}', 'how many vendors do we have {x}']
  units_built: ['how many units were built {x}', 'quantity manufactured {x}']
  units_scrapped: ['how many units were scrapped {x}', 'scrapped quantity {x}']
  avg_rating: ['what''s the average rating {x}', 'average review score {x}', 'how are our products rated {x}']
  avg_age: ['what is the average age of employees {x}', 'how old are our employees on average {x}']
  resource_hours: ['machine hours {x}', 'how many resource hours were used {x}']
  pay_change_count: ['how many pay raises were given {x}', 'number of pay changes {x}']
  stock_on_hand: ['how much stock do we have {x}', 'inventory on hand {x}', 'units in stock {x}', 'how many are in stock {x}']

# Phrases per flag. Without an entry the flag's `say` words are used.
flag_words:
  online: [online, placed online, from the website, from internet sales, through the web store]
  reseller: [through resellers, from resellers, placed by sales reps, in the reseller channel]
  discounted: [sold at a discount, with a discount, on discounted lines]
  currently_sold: [that are still sold, currently for sale, still on sale, that are active]
  no_longer_sold: [that are no longer sold, that were discontinued, no longer for sale]
  salable: [that are finished goods, that are salable]
  made_in_house: [that we manufacture, made in-house, that we make ourselves]
  bought_in: [that we buy in, that are purchased, bought from vendors]
  store_customer: [from store customers, for store customers, from resellers' stores, for business customers]
  individual_customer: [from individual customers, for individual customers, from consumers, from retail customers]
  salaried: [who are salaried, on salary, salaried]
  hourly: [who are hourly, paid hourly, hourly]
  preferred_vendor: [that are preferred vendors, from preferred vendors, with preferred status]
  active_vendor: [that are active, still in use, that are active vendors]
  has_scrap: [that had scrap, with scrapped units, that had failures]
  has_rejects: [with rejected items, that had rejects]
  shipped_late: [that shipped late, shipped after the due date, that were late]
  foreign_currency: [paid in a foreign currency, in currencies other than dollars]
  paid_by_card: [paid by credit card, paid with a card]
  active_offer: [that are running now, currently active, that are still running]
  current_employee: [who are current employees, still employed]
  homeowner: [who own their home, who are homeowners]
  hired_candidate: [who were hired, that we hired]
  current_assignment: [currently assigned, in their current territory]
  past_department: [in departments they have left, in previous departments]
  current_bom: [still in use, in the current bill of materials]
  current_cost: [at the current cost, for the current cost]
  current_price: [at the current price, for the current price]
  archived: [in the archive, that are archived]
  late_work_order: [that finished late, completed after the due date]
  delayed_operation: [that ran late, behind schedule]
  is_folder: [that are folders]
  is_file: [that are actual documents, 'that are files, not folders']
  has_instructions: [with manufacturing instructions, that have assembly instructions]
  has_catalog_description: [with a catalog description]
  primary_address: [for main addresses, for primary addresses]

