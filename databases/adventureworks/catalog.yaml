# AdventureWorks semantic catalog: every table, structure only (no data values).
#
# This is the meaning layer between questions and SQL. A question becomes a small
# plan (measures, group_by, filters, time, order_by, limit) over the names below, and
# compile.py turns the plan into one SELECT. Joins only ever run from the fact's
# base table towards "one" sides (many-to-one), so totals never double count.
#
# Built from the database's foreign keys and column comments, then edited by hand.
# Things marked REVIEW are judgement calls to check.

project:
  name: AdventureWorks             # in the system prompt ("questions about the AdventureWorks database")
  conninfo: dbname=Adventureworks  # aq's default --db; value lookups and the test set
  train_db: adventureworks_shifted # where gen_plans runs its plans (dates moved up to today)
  test_db: adventureworks_shifted  # where scores are computed (relative dates need recent data)
  model_file: advworx-plans.gguf   # the model aq loads from its data dir
  schemas: [sales, person, production, purchasing, humanresources]   # what coverage.py checks

# Facts that are lists of things rather than events: preferred for plans with no measures
# (facts with a `list:` key are added after these).
entity_facts: [products, customers, employees, vendors]

# How aq's live lookup finds names in a question (values.py).
lookup:
  # Never looked up: the values are the catalog's own words, learned from the wording itself.
  skip: [
    channel, customer_gender, customer_marital_status, customer_type, document_status,
    email_promotion, gender, marital_status, order_status, pay_frequency, person_type, po_status,
    product_class, product_style, store_business_type, tax_type, transaction_type, vendor_rating]
  # Looked up only when the question also names the dimension ("day shift", "home address").
  context: [
    address_type, billing_city, billing_country, billing_state, bom_unit, candidate_city,
    candidate_education, candidate_last_job, candidate_major, commute_distance, contact_type,
    country_code, currency_code, customer_city, customer_country, customer_state, department_group,
    document_folder, document_revision, education, employee_city, employee_country, employee_state,
    file_extension, from_currency, job_title, language, maintenance_years, occupation,
    offer_category, phone_type, postal_code, product_number, reason_type, shelf, shift, size,
    size_unit, state_code, store_bank, store_brands, store_internet, store_specialty,
    tax_rate_name, territory_country, title, vendor_city, vendor_country, vendor_state,
    vendor_unit, warranty, weight_unit, yearly_income]
  # Names that are also everyday words in questions ("sales by territory"): never a hint.
  common_words: [
    billing, black, document, each, engineering, executive, finance, maintenance, marketing, other,
    paint, price, production, purchasing, quality, review, sales, shipping, white]

nodes:            # alias -> table. One alias per role (a person can be a customer or a sales person).
  soh:          Sales.SalesOrderHeader
  sod:          Sales.SalesOrderDetail
  cust:         Sales.Customer
  cust_person:  Person.Person
  store:        Sales.Store
  terr:         Sales.SalesTerritory
  sp:           Sales.SalesPerson
  sp_person:    Person.Person
  ship_addr:    Person.Address
  ship_state:   Person.StateProvince
  ship_country: Person.CountryRegion
  shipm:        Purchasing.ShipMethod
  offer:        Sales.SpecialOffer
  prod:         Production.Product
  psub:         Production.ProductSubcategory
  pcat:         Production.ProductCategory
  pmodel:       Production.ProductModel
  poh:          Purchasing.PurchaseOrderHeader
  pod:          Purchasing.PurchaseOrderDetail
  vendor:       Purchasing.Vendor
  emp:          HumanResources.Employee
  emp_person:   Person.Person
  edh:          HumanResources.EmployeeDepartmentHistory
  dept:         HumanResources.Department
  shift:        HumanResources.Shift
  wo:           Production.WorkOrder
  scrap:        Production.ScrapReason
  inv:          Production.ProductInventory
  loc:          Production.Location
  # ---- added for full coverage (round 3) ----
  # Subquery nodes: one row per key, so joins to them stay many-to-one.
  bill_addr:    Person.Address
  bill_state:   Person.StateProvince
  bill_country: Person.CountryRegion
  card:         Sales.CreditCard
  fxrate:       Sales.CurrencyRate
  currency:     Sales.Currency
  ccur:         Sales.CountryRegionCurrency
  sohr:         Sales.SalesOrderHeaderSalesReason
  sreason:      Sales.SalesReason
  taxr:         Sales.SalesTaxRate
  cart:         Sales.ShoppingCartItem
  sop:          Sales.SpecialOfferProduct
  quota:        Sales.SalesPersonQuotaHistory
  sth:          Sales.SalesTerritoryHistory
  pcc:          Sales.PersonCreditCard
  per:          Person.Person
  per_email:    Person.EmailAddress
  per_phone:    Person.PersonPhone
  phone_type:   Person.PhoneNumberType
  cust_email:   Person.EmailAddress
  cust_phone:   Person.PersonPhone
  emp_email:    Person.EmailAddress
  emp_phone:    Person.PersonPhone
  bea:          Person.BusinessEntityAddress
  addrtype:     Person.AddressType
  addr_person:  Person.Person
  bec:          Person.BusinessEntityContact
  contact:      Person.Person
  ctype:        Person.ContactType
  cust_demo: >-
    (SELECT d.BusinessEntityID,
    (xpath('/s:IndividualSurvey/s:TotalPurchaseYTD/text()', d.Demographics, n.ns))[1]::text::numeric AS TotalPurchaseYTD,
    (xpath('/s:IndividualSurvey/s:DateFirstPurchase/text()', d.Demographics, n.ns))[1]::text::date AS DateFirstPurchase,
    (xpath('/s:IndividualSurvey/s:BirthDate/text()', d.Demographics, n.ns))[1]::text::date AS BirthDate,
    (xpath('/s:IndividualSurvey/s:MaritalStatus/text()', d.Demographics, n.ns))[1]::text AS MaritalStatus,
    (xpath('/s:IndividualSurvey/s:YearlyIncome/text()', d.Demographics, n.ns))[1]::text AS YearlyIncome,
    (xpath('/s:IndividualSurvey/s:Gender/text()', d.Demographics, n.ns))[1]::text AS Gender,
    (xpath('/s:IndividualSurvey/s:TotalChildren/text()', d.Demographics, n.ns))[1]::text::int AS TotalChildren,
    (xpath('/s:IndividualSurvey/s:NumberChildrenAtHome/text()', d.Demographics, n.ns))[1]::text::int AS NumberChildrenAtHome,
    (xpath('/s:IndividualSurvey/s:Education/text()', d.Demographics, n.ns))[1]::text AS Education,
    (xpath('/s:IndividualSurvey/s:Occupation/text()', d.Demographics, n.ns))[1]::text AS Occupation,
    (xpath('/s:IndividualSurvey/s:HomeOwnerFlag/text()', d.Demographics, n.ns))[1]::text AS HomeOwnerFlag,
    (xpath('/s:IndividualSurvey/s:NumberCarsOwned/text()', d.Demographics, n.ns))[1]::text::int AS NumberCarsOwned,
    (xpath('/s:IndividualSurvey/s:CommuteDistance/text()', d.Demographics, n.ns))[1]::text AS CommuteDistance
    FROM Person.Person d,
    (SELECT ARRAY[ARRAY['s', 'http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/IndividualSurvey']] AS ns) n
    WHERE d.Demographics IS NOT NULL)
  store_demo: >-
    (SELECT d.BusinessEntityID,
    (xpath('/s:StoreSurvey/s:AnnualSales/text()', d.Demographics, n.ns))[1]::text::numeric AS AnnualSales,
    (xpath('/s:StoreSurvey/s:AnnualRevenue/text()', d.Demographics, n.ns))[1]::text::numeric AS AnnualRevenue,
    (xpath('/s:StoreSurvey/s:BankName/text()', d.Demographics, n.ns))[1]::text AS BankName,
    (xpath('/s:StoreSurvey/s:BusinessType/text()', d.Demographics, n.ns))[1]::text AS BusinessType,
    (xpath('/s:StoreSurvey/s:YearOpened/text()', d.Demographics, n.ns))[1]::text::int AS YearOpened,
    (xpath('/s:StoreSurvey/s:Specialty/text()', d.Demographics, n.ns))[1]::text AS Specialty,
    (xpath('/s:StoreSurvey/s:SquareFeet/text()', d.Demographics, n.ns))[1]::text::int AS SquareFeet,
    (xpath('/s:StoreSurvey/s:Brands/text()', d.Demographics, n.ns))[1]::text AS Brands,
    (xpath('/s:StoreSurvey/s:Internet/text()', d.Demographics, n.ns))[1]::text AS Internet,
    (xpath('/s:StoreSurvey/s:NumberEmployees/text()', d.Demographics, n.ns))[1]::text::int AS NumberEmployees
    FROM Sales.Store d,
    (SELECT ARRAY[ARRAY['s', 'http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/StoreSurvey']] AS ns) n
    WHERE d.Demographics IS NOT NULL)
  # Where a customer is: the store's address for store customers, the person's home otherwise.
  cust_loc: >-
    (SELECT DISTINCT ON (c.CustomerID) c.CustomerID, a.AddressLine1, a.AddressLine2, a.City, a.PostalCode,
    s.Name AS State, r.Name AS Country
    FROM Sales.Customer c
    JOIN Person.BusinessEntityAddress b ON b.BusinessEntityID = COALESCE(c.StoreID, c.PersonID)
    JOIN Person.Address a ON a.AddressID = b.AddressID
    JOIN Person.StateProvince s ON s.StateProvinceID = a.StateProvinceID
    JOIN Person.CountryRegion r ON r.CountryRegionCode = s.CountryRegionCode
    ORDER BY c.CustomerID, b.AddressTypeID)
  vendor_loc: >-
    (SELECT DISTINCT ON (b.BusinessEntityID) b.BusinessEntityID, a.City, a.PostalCode, s.Name AS State, r.Name AS Country
    FROM Person.BusinessEntityAddress b
    JOIN Person.Address a ON a.AddressID = b.AddressID
    JOIN Person.StateProvince s ON s.StateProvinceID = a.StateProvinceID
    JOIN Person.CountryRegion r ON r.CountryRegionCode = s.CountryRegionCode
    ORDER BY b.BusinessEntityID, b.AddressTypeID)
  emp_loc: >-
    (SELECT DISTINCT ON (b.BusinessEntityID) b.BusinessEntityID, a.City, a.PostalCode, s.Name AS State, r.Name AS Country
    FROM Person.BusinessEntityAddress b
    JOIN Person.Address a ON a.AddressID = b.AddressID
    JOIN Person.StateProvince s ON s.StateProvinceID = a.StateProvinceID
    JOIN Person.CountryRegion r ON r.CountryRegionCode = s.CountryRegionCode
    ORDER BY b.BusinessEntityID, b.AddressTypeID)
  # HR
  cur_pay: >-
    (SELECT DISTINCT ON (BusinessEntityID) BusinessEntityID, Rate, PayFrequency
    FROM HumanResources.EmployeePayHistory ORDER BY BusinessEntityID, RateChangeDate DESC)
  # The manager is the employee one level up the organization tree (/1/2/ reports to /1/).
  emp_mgr: >-
    (SELECT e.BusinessEntityID, p.FirstName || ' ' || p.LastName AS ManagerName
    FROM HumanResources.Employee e
    JOIN HumanResources.Employee m ON m.OrganizationNode = regexp_replace(e.OrganizationNode, '[0-9]+/$', '')
    AND e.OrganizationNode <> '/'
    JOIN Person.Person p ON p.BusinessEntityID = m.BusinessEntityID)
  eph:          HumanResources.EmployeePayHistory
  edh_all:      HumanResources.EmployeeDepartmentHistory
  jc: >-
    (SELECT j.JobCandidateID, j.BusinessEntityID,
    (xpath('/r:Resume/r:Name/r:Name.First/text()', j.Resume, n.ns))[1]::text || ' ' ||
    (xpath('/r:Resume/r:Name/r:Name.Last/text()', j.Resume, n.ns))[1]::text AS Name,
    (xpath('/r:Resume/r:EMail/text()', j.Resume, n.ns))[1]::text AS EMail,
    trim((xpath('/r:Resume/r:Skills/text()', j.Resume, n.ns))[1]::text) AS Skills,
    (xpath('/r:Resume/r:Education/r:Edu.Level/text()', j.Resume, n.ns))[1]::text AS EducationLevel,
    (xpath('/r:Resume/r:Education/r:Edu.Major/text()', j.Resume, n.ns))[1]::text AS Major,
    (xpath('/r:Resume/r:Employment/r:Emp.JobTitle/text()', j.Resume, n.ns))[1]::text AS LastJobTitle,
    (xpath('/r:Resume/r:Employment/r:Emp.OrgName/text()', j.Resume, n.ns))[1]::text AS LastEmployer,
    (xpath('/r:Resume/r:Address/r:Addr.Location/r:Location/r:Loc.City/text()', j.Resume, n.ns))[1]::text AS City
    FROM HumanResources.JobCandidate j,
    (SELECT ARRAY[ARRAY['r', 'http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/Resume']] AS ns) n)
  buyer:        HumanResources.Employee
  buyer_person: Person.Person
  # Production
  um_size:      Production.UnitMeasure
  um_weight:    Production.UnitMeasure
  um_bom:       Production.UnitMeasure
  um_vendor:    Production.UnitMeasure
  model_info: >-
    (SELECT m.ProductModelID,
    trim((xpath('/p1:ProductDescription/p1:Summary/html:p/text()', m.CatalogDescription, n.ns))[1]::text) AS Summary,
    (xpath('/p1:ProductDescription/p1:Features/wm:Warranty/wm:WarrantyPeriod/text()', m.CatalogDescription, n.ns))[1]::text AS WarrantyPeriod,
    (xpath('/p1:ProductDescription/p1:Features/wm:Maintenance/wm:NoOfYears/text()', m.CatalogDescription, n.ns))[1]::text AS MaintenanceYears
    FROM Production.ProductModel m,
    (SELECT ARRAY[ARRAY['p1', 'http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelDescription'],
    ARRAY['wm', 'http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelWarrAndMain'],
    ARRAY['html', 'http://www.w3.org/1999/xhtml']] AS ns) n
    WHERE m.CatalogDescription IS NOT NULL)
  model_desc_en: >-
    (SELECT x.ProductModelID, d.Description FROM Production.ProductModelProductDescriptionCulture x
    JOIN Production.ProductDescription d ON d.ProductDescriptionID = x.ProductDescriptionID
    WHERE trim(x.CultureID) = 'en')
  prod_photo: >-
    (SELECT pp.ProductID, ph.LargePhotoFileName, ph.ThumbnailPhotoFileName
    FROM Production.ProductProductPhoto pp JOIN Production.ProductPhoto ph ON ph.ProductPhotoID = pp.ProductPhotoID
    WHERE pp."primary")
  pmpdc:        Production.ProductModelProductDescriptionCulture
  pdesc:        Production.ProductDescription
  culture:      Production.Culture
  doc:          Production.Document
  doc_folder:   Production.Document
  pdoc:         Production.ProductDocument
  pmi:          Production.ProductModelIllustration
  illus:        Production.Illustration
  pch:          Production.ProductCostHistory
  plph:         Production.ProductListPriceHistory
  rev:          Production.ProductReview
  th: >-
    (SELECT TransactionID, ProductID, ReferenceOrderID, ReferenceOrderLineID, TransactionDate, TransactionType,
    Quantity, ActualCost, FALSE AS Archived FROM Production.TransactionHistory
    UNION ALL
    SELECT TransactionID, ProductID, ReferenceOrderID, ReferenceOrderLineID, TransactionDate, TransactionType,
    Quantity, ActualCost, TRUE AS Archived FROM Production.TransactionHistoryArchive)
  bom:          Production.BillOfMaterials
  asm:          Production.Product
  wor:          Production.WorkOrderRouting
  # Purchasing
  pv:           Purchasing.ProductVendor

# Nodes that are one role of a shared table (a buyer is a person, an assembly is a product).
# A plain list never starts from them: "list the buyers" means people who placed purchase
# orders, so it starts from purchases, not from every person in Person.Person.
role_nodes: [cust_person, sp_person, emp_person, bill_addr, bill_state, bill_country, buyer, buyer_person, asm,
             um_size, um_weight, um_bom, um_vendor, addr_person, contact, cust_email, cust_phone, emp_email,
             emp_phone, per_email, per_phone, cust_loc, vendor_loc, emp_loc, cust_demo, doc_folder, cur_pay, emp_mgr]

# Many-to-one edges: [from, to, ON condition, optional]. optional = the foreign key can be
# NULL, so the compiler uses LEFT JOIN when the node is only displayed or grouped.
joins:
  - [sod,  soh,          "sod.SalesOrderID = soh.SalesOrderID"]
  - [sod,  prod,         "sod.ProductID = prod.ProductID"]
  - [sod,  offer,        "sod.SpecialOfferID = offer.SpecialOfferID"]
  - [soh,  cust,         "soh.CustomerID = cust.CustomerID"]
  - [soh,  terr,         "soh.TerritoryID = terr.TerritoryID"]
  - [soh,  sp,           "soh.SalesPersonID = sp.BusinessEntityID", optional]
  - [soh,  ship_addr,    "soh.ShipToAddressID = ship_addr.AddressID"]
  - [soh,  shipm,        "soh.ShipMethodID = shipm.ShipMethodID"]
  - [ship_addr, ship_state, "ship_addr.StateProvinceID = ship_state.StateProvinceID"]
  - [ship_state, ship_country, "ship_state.CountryRegionCode = ship_country.CountryRegionCode"]
  - [cust, cust_person,  "cust.PersonID = cust_person.BusinessEntityID", optional]
  - [cust, store,        "cust.StoreID = store.BusinessEntityID", optional]
  - [cust, terr,         "cust.TerritoryID = terr.TerritoryID", optional]
  - [sp,   sp_person,    "sp.BusinessEntityID = sp_person.BusinessEntityID"]
  - [sp,   terr,         "sp.TerritoryID = terr.TerritoryID", optional]
  - [prod, psub,         "prod.ProductSubcategoryID = psub.ProductSubcategoryID", optional]
  - [psub, pcat,         "psub.ProductCategoryID = pcat.ProductCategoryID"]
  - [prod, pmodel,       "prod.ProductModelID = pmodel.ProductModelID", optional]
  - [pod,  poh,          "pod.PurchaseOrderID = poh.PurchaseOrderID"]
  - [pod,  prod,         "pod.ProductID = prod.ProductID"]
  - [poh,  vendor,       "poh.VendorID = vendor.BusinessEntityID"]
  - [poh,  shipm,        "poh.ShipMethodID = shipm.ShipMethodID"]
  - [emp,  emp_person,   "emp.BusinessEntityID = emp_person.BusinessEntityID"]
  # Current department only (EndDate IS NULL): exactly one row per employee.
  - [emp,  edh,          "emp.BusinessEntityID = edh.BusinessEntityID AND edh.EndDate IS NULL"]
  - [edh,  dept,         "edh.DepartmentID = dept.DepartmentID"]
  - [edh,  shift,        "edh.ShiftID = shift.ShiftID"]
  - [wo,   prod,         "wo.ProductID = prod.ProductID"]
  - [wo,   scrap,        "wo.ScrapReasonID = scrap.ScrapReasonID", optional]
  - [inv,  prod,         "inv.ProductID = prod.ProductID"]
  - [inv,  loc,          "inv.LocationID = loc.LocationID"]
  # ---- added for full coverage (round 3) ----
  # sales orders
  - [soh,  bill_addr,    "soh.BillToAddressID = bill_addr.AddressID"]
  - [bill_addr, bill_state, "bill_addr.StateProvinceID = bill_state.StateProvinceID"]
  - [bill_state, bill_country, "bill_state.CountryRegionCode = bill_country.CountryRegionCode"]
  - [soh,  card,         "soh.CreditCardID = card.CreditCardID", optional]
  - [soh,  fxrate,       "soh.CurrencyRateID = fxrate.CurrencyRateID", optional]
  - [fxrate, currency,   "fxrate.ToCurrencyCode = currency.CurrencyCode"]
  - [sohr, soh,          "sohr.SalesOrderID = soh.SalesOrderID"]
  - [sohr, sreason,      "sohr.SalesReasonID = sreason.SalesReasonID"]
  - [ccur, ship_country, "ccur.CountryRegionCode = ship_country.CountryRegionCode"]
  - [ccur, currency,     "ccur.CurrencyCode = currency.CurrencyCode"]
  - [taxr, ship_state,   "taxr.StateProvinceID = ship_state.StateProvinceID"]
  - [cart, prod,         "cart.ProductID = prod.ProductID"]
  - [sop,  offer,        "sop.SpecialOfferID = offer.SpecialOfferID"]
  - [sop,  prod,         "sop.ProductID = prod.ProductID"]
  - [store, sp,          "store.SalesPersonID = sp.BusinessEntityID", optional]
  - [store, store_demo,  "store.BusinessEntityID = store_demo.BusinessEntityID", optional]
  - [cust, cust_loc,     "cust.CustomerID = cust_loc.CustomerID", optional]
  - [quota, sp,          "quota.BusinessEntityID = sp.BusinessEntityID"]
  - [sth,  sp,           "sth.BusinessEntityID = sp.BusinessEntityID"]
  - [sth,  terr,         "sth.TerritoryID = terr.TerritoryID"]
  - [pcc,  per,          "pcc.BusinessEntityID = per.BusinessEntityID"]
  - [pcc,  card,         "pcc.CreditCardID = card.CreditCardID"]
  # people, contacts and addresses
  - [per,  per_email,    "per.BusinessEntityID = per_email.BusinessEntityID", optional]
  - [per,  per_phone,    "per.BusinessEntityID = per_phone.BusinessEntityID", optional]
  - [per_phone, phone_type, "per_phone.PhoneNumberTypeID = phone_type.PhoneNumberTypeID"]
  - [per,  cust_demo,    "per.BusinessEntityID = cust_demo.BusinessEntityID", optional]
  - [cust_person, cust_demo,  "cust_person.BusinessEntityID = cust_demo.BusinessEntityID", optional]
  - [cust_person, cust_email, "cust_person.BusinessEntityID = cust_email.BusinessEntityID", optional]
  - [cust_person, cust_phone, "cust_person.BusinessEntityID = cust_phone.BusinessEntityID", optional]
  - [emp_person, emp_email,   "emp_person.BusinessEntityID = emp_email.BusinessEntityID", optional]
  - [emp_person, emp_phone,   "emp_person.BusinessEntityID = emp_phone.BusinessEntityID", optional]
  - [bea,  ship_addr,    "bea.AddressID = ship_addr.AddressID"]
  - [bea,  addrtype,     "bea.AddressTypeID = addrtype.AddressTypeID"]
  - [bea,  addr_person,  "bea.BusinessEntityID = addr_person.BusinessEntityID", optional]
  - [bea,  store,        "bea.BusinessEntityID = store.BusinessEntityID", optional]
  - [bea,  vendor,       "bea.BusinessEntityID = vendor.BusinessEntityID", optional]
  - [bec,  contact,      "bec.PersonID = contact.BusinessEntityID"]
  - [bec,  ctype,        "bec.ContactTypeID = ctype.ContactTypeID"]
  - [bec,  store,        "bec.BusinessEntityID = store.BusinessEntityID", optional]
  - [bec,  vendor,       "bec.BusinessEntityID = vendor.BusinessEntityID", optional]
  - [vendor, vendor_loc, "vendor.BusinessEntityID = vendor_loc.BusinessEntityID", optional]
  # HR
  - [emp,  emp_loc,      "emp.BusinessEntityID = emp_loc.BusinessEntityID", optional]
  - [emp,  cur_pay,      "emp.BusinessEntityID = cur_pay.BusinessEntityID", optional]
  - [emp,  emp_mgr,      "emp.BusinessEntityID = emp_mgr.BusinessEntityID", optional]
  - [eph,  emp,          "eph.BusinessEntityID = emp.BusinessEntityID"]
  - [edh_all, emp,       "edh_all.BusinessEntityID = emp.BusinessEntityID"]
  - [edh_all, dept,      "edh_all.DepartmentID = dept.DepartmentID"]
  - [edh_all, shift,     "edh_all.ShiftID = shift.ShiftID"]
  - [jc,   emp,          "jc.BusinessEntityID = emp.BusinessEntityID", optional]
  # production
  - [prod, um_size,      "prod.SizeUnitMeasureCode = um_size.UnitMeasureCode", optional]
  - [prod, um_weight,    "prod.WeightUnitMeasureCode = um_weight.UnitMeasureCode", optional]
  - [prod, prod_photo,   "prod.ProductID = prod_photo.ProductID", optional]
  - [pmodel, model_info, "pmodel.ProductModelID = model_info.ProductModelID", optional]
  - [pmodel, model_desc_en, "pmodel.ProductModelID = model_desc_en.ProductModelID", optional]
  - [pmpdc, pmodel,      "pmpdc.ProductModelID = pmodel.ProductModelID"]
  - [pmpdc, pdesc,       "pmpdc.ProductDescriptionID = pdesc.ProductDescriptionID"]
  - [pmpdc, culture,     "pmpdc.CultureID = culture.CultureID"]
  - [doc,  emp,          "doc.Owner = emp.BusinessEntityID"]
  - [doc,  doc_folder,   "doc_folder.DocumentNode = regexp_replace(doc.DocumentNode, '[0-9]+/$', '') AND doc.DocumentNode <> '/'", optional]
  - [pdoc, prod,         "pdoc.ProductID = prod.ProductID"]
  - [pdoc, doc,          "pdoc.DocumentNode = doc.DocumentNode"]
  - [pmi,  pmodel,       "pmi.ProductModelID = pmodel.ProductModelID"]
  - [pmi,  illus,        "pmi.IllustrationID = illus.IllustrationID"]
  - [pch,  prod,         "pch.ProductID = prod.ProductID"]
  - [plph, prod,         "plph.ProductID = prod.ProductID"]
  - [rev,  prod,         "rev.ProductID = prod.ProductID"]
  - [th,   prod,         "th.ProductID = prod.ProductID"]
  - [bom,  prod,         "bom.ComponentID = prod.ProductID"]
  - [bom,  asm,          "bom.ProductAssemblyID = asm.ProductID", optional]
  - [bom,  um_bom,       "bom.UnitMeasureCode = um_bom.UnitMeasureCode"]
  - [wor,  wo,           "wor.WorkOrderID = wo.WorkOrderID"]
  - [wor,  prod,         "wor.ProductID = prod.ProductID"]
  - [wor,  loc,          "wor.LocationID = loc.LocationID"]
  # purchasing
  - [poh,  buyer,        "poh.EmployeeID = buyer.BusinessEntityID"]
  - [buyer, buyer_person, "buyer.BusinessEntityID = buyer_person.BusinessEntityID"]
  - [pv,   prod,         "pv.ProductID = prod.ProductID"]
  - [pv,   vendor,       "pv.BusinessEntityID = vendor.BusinessEntityID"]
  - [pv,   um_vendor,    "pv.UnitMeasureCode = um_vendor.UnitMeasureCode"]

# Facts: what you can count or add up. Listed in order of preference: when two facts
# both answer a plan, the first one wins (orders before order_lines, so a plain
# "revenue by territory" sums order headers, and "revenue by category" falls through
# to order lines because only they reach products).
facts:
  orders:
    base: soh
    date: soh.OrderDate
    describe: one row per sales order
    measures:
      order_count:     {sql: "COUNT(*)", say: [number of orders, how many orders, order count]}
      revenue:         {sql: "SUM(soh.SubTotal)", say: [sales, revenue, sales amount, turnover, how much we sold]}
      total_due:       {sql: "SUM(soh.TotalDue)", say: [total due, amount billed, sales including tax and freight]}
      avg_order_value: {sql: "AVG(soh.SubTotal)", say: [average order value, average order size, average sale]}
      freight:         {sql: "SUM(soh.Freight)", say: [freight, shipping cost]}
      tax:             {sql: "SUM(soh.TaxAmt)", say: [tax, tax collected]}
      customer_count:  {sql: "COUNT(DISTINCT soh.CustomerID)", say: [number of customers who ordered, buying customers]}
      avg_days_to_ship: {sql: "AVG(soh.ShipDate::date - soh.OrderDate::date)", say: [average days to ship, days from order to shipment, shipping time]}
      late_orders:     {sql: "COUNT(*) FILTER (WHERE soh.ShipDate > soh.DueDate)", say: [late orders, orders shipped late, overdue orders]}
  order_lines:
    base: sod
    date: soh.OrderDate
    describe: one row per product on a sales order
    measures:
      revenue:         {sql: "SUM(sod.OrderQty * sod.UnitPrice * (1 - sod.UnitPriceDiscount))", say: [sales, revenue]}
      units_sold:      {sql: "SUM(sod.OrderQty)", say: [units sold, quantity sold, how many sold]}
      order_count:     {sql: "COUNT(DISTINCT sod.SalesOrderID)", say: [number of orders]}
      avg_unit_price:  {sql: "AVG(sod.UnitPrice)", say: [average selling price, average unit price]}
      discount_amount: {sql: "SUM(sod.OrderQty * sod.UnitPrice * sod.UnitPriceDiscount)", say: [discounts given, discount amount]}
      customer_count:  {sql: "COUNT(DISTINCT soh.CustomerID)", say: [number of customers who bought]}
      line_count:      {sql: "COUNT(*)", say: [number of order lines, order line count, line items]}
      cost_of_sales:   {sql: "SUM(sod.OrderQty * prod.StandardCost)", say: [cost of goods sold, cost of sales, COGS]}
      gross_profit:    {sql: "SUM(sod.OrderQty * (sod.UnitPrice * (1 - sod.UnitPriceDiscount) - prod.StandardCost))", say: [gross profit, profit]}
      gross_margin_pct: {sql: "ROUND(100 * SUM(sod.OrderQty * (sod.UnitPrice * (1 - sod.UnitPriceDiscount) - prod.StandardCost)) / NULLIF(SUM(sod.OrderQty * sod.UnitPrice * (1 - sod.UnitPriceDiscount)), 0), 2)", say: [gross margin percent, margin percentage, profit margin]}
  purchases:
    base: poh
    date: poh.OrderDate
    describe: one row per purchase order to a vendor
    measures:
      po_count:        {sql: "COUNT(*)", say: [number of purchase orders]}
      purchase_spend:  {sql: "SUM(poh.SubTotal)", say: [purchase spend, amount spent with vendors, purchasing cost]}
      po_freight:      {sql: "SUM(poh.Freight)", say: [purchase freight]}
      po_tax:          {sql: "SUM(poh.TaxAmt)", say: [purchase tax, tax paid to vendors]}
      po_total:        {sql: "SUM(poh.SubTotal + poh.TaxAmt + poh.Freight)", say: [purchase total including tax and freight, total purchase cost]}
  purchase_lines:
    base: pod
    date: poh.OrderDate
    describe: one row per product on a purchase order
    measures:
      purchase_spend:  {sql: "SUM(pod.OrderQty * pod.UnitPrice)", say: [purchase spend]}
      units_purchased: {sql: "SUM(pod.OrderQty)", say: [units purchased, quantity ordered from vendors]}
      units_received:  {sql: "SUM(pod.ReceivedQty)", say: [units received]}
      units_rejected:  {sql: "SUM(pod.RejectedQty)", say: [units rejected, rejected quantity]}
      avg_purchase_price: {sql: "AVG(pod.UnitPrice)", say: [average purchase price, average price paid]}
  work_orders:
    base: wo
    date: wo.StartDate
    describe: one row per manufacturing work order
    measures:
      work_order_count: {sql: "COUNT(*)", say: [number of work orders]}
      units_built:      {sql: "SUM(wo.OrderQty)", say: [units built, quantity manufactured]}
      units_scrapped:   {sql: "SUM(wo.ScrappedQty)", say: [units scrapped, scrap]}
      scrap_rate:       {sql: "ROUND(SUM(wo.ScrappedQty)::numeric / NULLIF(SUM(wo.OrderQty), 0), 4)", say: [scrap rate]}
      avg_build_days:  {sql: "AVG(wo.EndDate::date - wo.StartDate::date)", say: [average build time in days, average days to complete]}
      late_work_orders: {sql: "COUNT(*) FILTER (WHERE wo.EndDate > wo.DueDate)", say: [late work orders, work orders finished late]}
  inventory:
    base: inv
    describe: one row per product per storage location
    measures:
      stock_on_hand:   {sql: "SUM(inv.Quantity)", say: [stock, inventory, quantity on hand, units in stock]}
      stock_locations: {sql: "COUNT(*)", say: [number of stock locations, bins in use]}
  products:
    base: prod
    describe: the product list (no sales)
    measures:
      product_count:   {sql: "COUNT(*)", say: [number of products, how many products]}
      avg_list_price:  {sql: "AVG(prod.ListPrice)", say: [average price, average list price]}
      max_list_price:  {sql: "MAX(prod.ListPrice)", say: [highest price, most expensive price]}
      min_list_price:  {sql: "MIN(prod.ListPrice)", say: [lowest price, cheapest price]}
      avg_standard_cost: {sql: "AVG(prod.StandardCost)", say: [average cost]}
      avg_weight:      {sql: "AVG(prod.Weight)", say: [average weight]}
      avg_safety_stock: {sql: "AVG(prod.SafetyStockLevel)", say: [average safety stock level]}
  customers:
    base: cust
    describe: the customer list (no sales)
    measures:
      customer_count:  {sql: "COUNT(*)", say: [number of customers, how many customers]}
      avg_yearly_purchases: {sql: "AVG(cust_demo.TotalPurchaseYTD)", say: [average purchases year to date per customer]}
      avg_customer_age: {sql: "AVG(EXTRACT(YEAR FROM age(CURRENT_DATE, cust_demo.BirthDate)))", say: [average customer age]}
      avg_children:    {sql: "AVG(cust_demo.TotalChildren)", say: [average number of children]}
      avg_cars:        {sql: "AVG(cust_demo.NumberCarsOwned)", say: [average cars owned]}
  employees:
    base: emp
    date: emp.HireDate
    describe: current employees (the profile shows every employee is current)
    measures:
      headcount:          {sql: "COUNT(*)", say: [number of employees, headcount, staff count]}
      avg_vacation_hours: {sql: "AVG(emp.VacationHours)", say: [average vacation hours]}
      avg_sick_hours:     {sql: "AVG(emp.SickLeaveHours)", say: [average sick leave]}
      avg_pay_rate:      {sql: "AVG(cur_pay.Rate)", say: [average pay rate, average hourly rate, average pay]}
      max_pay_rate:      {sql: "MAX(cur_pay.Rate)", say: [highest pay rate, top pay rate]}
      min_pay_rate:      {sql: "MIN(cur_pay.Rate)", say: [lowest pay rate]}
      avg_age:           {sql: "AVG(EXTRACT(YEAR FROM age(CURRENT_DATE, emp.BirthDate)))", say: [average age]}
      total_vacation_hours: {sql: "SUM(emp.VacationHours)", say: [total vacation hours, vacation hours owed]}
  vendors:
    base: vendor
    describe: the vendor list
    measures:
      vendor_count:    {sql: "COUNT(*)", say: [number of vendors, how many suppliers]}
  # ---- added for full coverage (round 3) ----
  order_reasons:
    base: sohr
    date: soh.OrderDate
    describe: one row per reason a customer gave for an order (an order can give several)
    measures:
      order_count:     {sql: "COUNT(DISTINCT sohr.SalesOrderID)", say: [number of orders]}
      revenue:         {sql: "SUM(soh.SubTotal)", say: [sales, revenue]}
      reason_count:    {sql: "COUNT(*)", say: [times given, number of times a reason was cited, mentions]}
  sales_people:
    base: sp
    describe: the sales people with their quota, bonus, commission and year-to-date sales as stored
    list: {entity: sales_person, attrs: [sales_quota, bonus, commission_pct, sales_ytd, sales_last_year, territory]}
    measures:
      sales_person_count:  {sql: "COUNT(*)", say: [number of sales people, how many sales reps]}
      rep_sales_ytd:       {sql: "SUM(sp.SalesYTD)", say: [sales year to date for sales people, sales reps' YTD sales]}
      rep_sales_last_year: {sql: "SUM(sp.SalesLastYear)", say: [sales people's sales last year as recorded]}
      total_bonus:         {sql: "SUM(sp.Bonus)", say: [total bonus, bonuses]}
      avg_bonus:           {sql: "AVG(sp.Bonus)", say: [average bonus]}
      avg_commission:      {sql: "AVG(sp.CommissionPct)", say: [average commission rate, average commission]}
      total_quota:         {sql: "SUM(sp.SalesQuota)", say: [total sales quota, quota]}
  quotas:
    base: quota
    date: quota.QuotaDate
    describe: one row per sales person per quota period
    measures:
      quota_amount:    {sql: "SUM(quota.SalesQuota)", say: [quota amount, sales quota, sales targets]}
      quota_count:     {sql: "COUNT(*)", say: [number of quotas set]}
      avg_quota:       {sql: "AVG(quota.SalesQuota)", say: [average quota]}
  territories:
    base: terr
    describe: the sales territories with their year-to-date and last-year sales and cost as stored
    list: {entity: territory, attrs: [territory_group, territory_country, territory_sales_ytd, territory_sales_last_year, territory_cost_ytd, territory_cost_last_year]}
    measures:
      territory_count:           {sql: "COUNT(*)", say: [number of territories]}
      territory_sales_ytd:       {sql: "SUM(terr.SalesYTD)", say: [territory sales year to date as recorded]}
      territory_sales_last_year: {sql: "SUM(terr.SalesLastYear)", say: [territory sales last year as recorded]}
      territory_cost_ytd:        {sql: "SUM(terr.CostYTD)", say: [territory cost year to date]}
      territory_cost_last_year:  {sql: "SUM(terr.CostLastYear)", say: [territory cost last year]}
  territory_assignments:
    base: sth
    date: sth.StartDate
    describe: which sales person covered which territory, and when
    measures:
      assignment_count: {sql: "COUNT(*)", say: [number of territory assignments]}
  currency_rates:
    base: fxrate
    date: fxrate.CurrencyRateDate
    describe: daily exchange rates from US dollars
    measures:
      avg_exchange_rate: {sql: "AVG(fxrate.AverageRate)", say: [average exchange rate, exchange rate]}
      avg_closing_rate:  {sql: "AVG(fxrate.EndOfDayRate)", say: [end of day rate, closing rate]}
      max_exchange_rate: {sql: "MAX(fxrate.AverageRate)", say: [highest exchange rate]}
      min_exchange_rate: {sql: "MIN(fxrate.AverageRate)", say: [lowest exchange rate]}
      rate_count:        {sql: "COUNT(*)", say: [number of rates recorded]}
  country_currencies:
    base: ccur
    describe: which currency each country uses
    measures:
      currency_country_count: {sql: "COUNT(*)", say: [number of countries using a currency]}
  tax_rates:
    base: taxr
    describe: sales tax rates by state or province
    list: {entity: tax_rate_name, attrs: [tax_rate, tax_type, ship_state]}
    measures:
      avg_tax_rate:    {sql: "AVG(taxr.TaxRate)", say: [average tax rate]}
      max_tax_rate:    {sql: "MAX(taxr.TaxRate)", say: [highest tax rate]}
      min_tax_rate:    {sql: "MIN(taxr.TaxRate)", say: [lowest tax rate]}
      tax_rate_count:  {sql: "COUNT(*)", say: [number of tax rates]}
  cart_items:
    base: cart
    date: cart.DateCreated
    describe: items sitting in online shopping carts
    measures:
      cart_item_count: {sql: "COUNT(*)", say: [number of cart items, items in shopping carts]}
      cart_units:      {sql: "SUM(cart.Quantity)", say: [units in carts, quantity in shopping carts]}
  offer_products:
    base: sop
    describe: which products each special offer applies to
    measures:
      offer_product_count: {sql: "COUNT(*)", say: [number of products on offer, products covered by promotions]}
  credit_cards:
    base: pcc
    describe: credit cards on file for people
    measures:
      card_count:      {sql: "COUNT(*)", say: [number of credit cards, cards on file]}
  people:
    base: per
    describe: everyone in the database (customers, employees, store and vendor contacts)
    list: {entity: person, attrs: [person_type, title, email, phone, phone_type, email_promotion]}
    measures:
      person_count:    {sql: "COUNT(*)", say: [number of people, how many people]}
  addresses:
    base: bea
    describe: addresses of people, stores and vendors, by address type
    measures:
      address_count:   {sql: "COUNT(*)", say: [number of addresses]}
  contacts:
    base: bec
    describe: contact people at stores and vendors, with their role
    list: {entity: contact, attrs: [contact_type, store, vendor]}
    measures:
      contact_count:   {sql: "COUNT(*)", say: [number of contacts]}
  pay_changes:
    base: eph
    date: eph.RateChangeDate
    describe: every pay rate change for every employee
    measures:
      pay_change_count: {sql: "COUNT(*)", say: [number of pay changes, raises]}
      avg_rate_set:    {sql: "AVG(eph.Rate)", say: [average new pay rate]}
  department_history:
    base: edh_all
    date: edh_all.StartDate
    describe: every department an employee has worked in, with start and end dates
    measures:
      department_moves: {sql: "COUNT(*)", say: [number of department assignments, department moves]}
  job_candidates:
    base: jc
    describe: job applicants and their resumes
    list: {entity: candidate, attrs: [candidate_education, candidate_major, candidate_last_job, candidate_last_employer, candidate_city, candidate_email]}
    measures:
      candidate_count: {sql: "COUNT(*)", say: [number of job candidates, applicants]}
  bill_of_materials:
    base: bom
    date: bom.StartDate
    describe: which components go into which assembly, and how many
    measures:
      component_count: {sql: "COUNT(*)", say: [number of components, parts count]}
      component_qty:   {sql: "SUM(bom.PerAssemblyQty)", say: [component quantity, parts needed]}
  model_descriptions:
    base: pmpdc
    describe: product model descriptions in each language
    measures:
      description_count: {sql: "COUNT(*)", say: [number of descriptions, translations]}
  documents:
    base: doc
    describe: product manuals and maintenance documents
    list: {entity: document, attrs: [document_status, document_file, document_revision, change_number, document_folder, employee]}
    measures:
      document_count:  {sql: "COUNT(*)", say: [number of documents]}
  product_documents:
    base: pdoc
    describe: which documents belong to which product
    measures:
      product_document_count: {sql: "COUNT(*)", say: [number of product documents]}
  model_illustrations:
    base: pmi
    describe: which illustrations belong to which product model
    measures:
      illustration_count: {sql: "COUNT(*)", say: [number of illustrations]}
  cost_history:
    base: pch
    date: pch.StartDate
    describe: standard cost of each product over time
    measures:
      cost_change_count: {sql: "COUNT(*)", say: [number of cost changes]}
      avg_historic_cost: {sql: "AVG(pch.StandardCost)", say: [average historical cost]}
  price_history:
    base: plph
    date: plph.StartDate
    describe: list price of each product over time
    measures:
      price_change_count: {sql: "COUNT(*)", say: [number of price changes]}
      avg_historic_price: {sql: "AVG(plph.ListPrice)", say: [average historical list price]}
  reviews:
    base: rev
    date: rev.ReviewDate
    describe: product reviews written by customers
    list: {entity: reviewer, attrs: [product, rating, review_comments, reviewer_email]}
    measures:
      review_count:    {sql: "COUNT(*)", say: [number of reviews]}
      avg_rating:      {sql: "AVG(rev.Rating)", say: [average rating, average review score]}
  transactions:
    base: th
    date: th.TransactionDate
    describe: every stock movement (sales, purchases, work orders), current and archived
    measures:
      transaction_count: {sql: "COUNT(*)", say: [number of transactions, stock movements]}
      transaction_qty:   {sql: "SUM(th.Quantity)", say: [quantity moved, transaction quantity]}
      transaction_value: {sql: "SUM(th.Quantity * th.ActualCost)", say: [transaction value, value of stock movements]}
  routing:
    base: wor
    date: wor.ScheduledStartDate
    describe: each manufacturing step of a work order at a work center
    measures:
      operation_count: {sql: "COUNT(*)", say: [number of operations, manufacturing steps]}
      resource_hours:  {sql: "SUM(wor.ActualResourceHrs)", say: [machine hours, resource hours, hours worked]}
      planned_cost:    {sql: "SUM(wor.PlannedCost)", say: [planned cost, budgeted manufacturing cost]}
      actual_cost:     {sql: "SUM(wor.ActualCost)", say: [actual cost, manufacturing cost]}
      cost_overrun:    {sql: "SUM(wor.ActualCost - wor.PlannedCost)", say: [cost overrun, cost variance]}
      avg_delay_days:  {sql: "AVG(wor.ActualEndDate::date - wor.ScheduledEndDate::date)", say: [average delay in days, average days late]}
  vendor_products:
    base: pv
    date: pv.LastReceiptDate
    describe: which vendor supplies which product, at what price and lead time
    measures:
      vendor_product_count: {sql: "COUNT(*)", say: [number of products supplied, supplied products]}
      avg_lead_time:       {sql: "AVG(pv.AverageLeadTime)", say: [average lead time, lead time]}
      avg_vendor_price:    {sql: "AVG(pv.StandardPrice)", say: [average vendor price]}
      avg_receipt_cost:    {sql: "AVG(pv.LastReceiptCost)", say: [average last receipt cost]}
      units_on_order:      {sql: "SUM(pv.OnOrderQty)", say: [units on order, quantity on order]}

# Dimensions: things to group by, filter on, or show. `node` is where the column lives;
# a dimension is usable from any fact whose base reaches that node through the joins.
# `decode` turns codes into words. No data values live here: aq looks names up in the database
# when a question is asked. `values` appears only where the catalog's own CASE defines them.
dimensions:
  # products
  product:         {node: prod, sql: "prod.Name", say: [product, item]}
  product_number:  {node: prod, sql: "prod.ProductNumber", say: [product number, SKU]}
  color:           {node: prod, sql: "prod.Color", say: [color, colour]}
  product_line:    {node: prod, sql: "prod.ProductLine", say: [product line], decode: {R: Road, M: Mountain, T: Touring, S: Standard}}
  product_class:   {node: prod, sql: "prod.Class", say: [class, quality class], decode: {H: High, M: Medium, L: Low}}
  product_style:   {node: prod, sql: "prod.Style", say: [style], decode: {W: Womens, M: Mens, U: Universal}}
  subcategory:     {node: psub, sql: "psub.Name", say: [subcategory, product type]}
  category:        {node: pcat, sql: "pcat.Name", say: [category, product category]}
  model:           {node: pmodel, sql: "pmodel.Name", say: [model, product model]}
  list_price:      {node: prod, sql: "prod.ListPrice", kind: number, say: [price, list price]}
  standard_cost:   {node: prod, sql: "prod.StandardCost", kind: number, say: [cost, standard cost]}
  weight:          {node: prod, sql: "prod.Weight", kind: number, say: [weight]}
  days_to_manufacture: {node: prod, sql: "prod.DaysToManufacture", kind: number, say: [days to manufacture, build time]}
  # customers and channel
  customer:        {node: [cust, store, cust_person], sql: "COALESCE(store.Name, cust_person.FirstName || ' ' || cust_person.LastName)", say: [customer, client, buyer]}
  customer_type:   {node: cust, sql: "CASE WHEN cust.StoreID IS NOT NULL THEN 'Store' ELSE 'Individual' END", say: [customer type], values: [Store, Individual]}
  store:           {node: store, sql: "store.Name", say: [store, reseller, shop]}
  channel:         {node: soh, sql: "CASE WHEN soh.OnlineOrderFlag THEN 'Online' ELSE 'Reseller' END", say: [channel, sales channel], values: [Online, Reseller]}
  # geography. REVIEW: "territory" is where the sale was booked (order's territory);
  # "ship country/state/city" is where it was delivered. They usually agree.
  territory:       {node: terr, sql: "terr.Name", say: [territory, sales territory, region]}
  territory_group: {node: terr, sql: "terr.\"group\"", say: [continent, geographic group, market]}
  territory_country: {node: terr, sql: "terr.CountryRegionCode", say: [country code]}
  ship_country:    {node: ship_country, sql: "ship_country.Name", say: [country, ship-to country]}
  ship_state:      {node: ship_state, sql: "ship_state.Name", say: [state, province, ship-to state]}
  ship_city:       {node: ship_addr, sql: "ship_addr.City", say: [city, ship-to city]}
  ship_method:     {node: shipm, sql: "shipm.Name", say: [shipping method, carrier]}
  # people
  sales_person:    {node: [sp, sp_person], sql: "sp_person.FirstName || ' ' || sp_person.LastName", say: [sales person, sales rep, salesperson]}
  employee:        {node: emp_person, sql: "emp_person.FirstName || ' ' || emp_person.LastName", say: [employee, staff member]}
  job_title:       {node: emp, sql: "emp.JobTitle", say: [job title, role, position]}
  department:      {node: dept, sql: "dept.Name", say: [department]}
  department_group: {node: dept, sql: "dept.GroupName", say: [department group, division]}
  shift:           {node: shift, sql: "shift.Name", say: [shift]}
  gender:          {node: emp, sql: "emp.Gender", say: [gender], decode: {M: Male, F: Female}}
  marital_status:  {node: emp, sql: "emp.MaritalStatus", say: [marital status], decode: {M: Married, S: Single}}
  pay_type:        {node: emp, sql: "CASE WHEN emp.SalariedFlag THEN 'Salaried' ELSE 'Hourly' END", say: [pay type, salaried or hourly], values: [Salaried, Hourly]}
  hire_date:       {node: emp, sql: "emp.HireDate", kind: date, say: [hire date, start date]}
  vacation_hours:  {node: emp, sql: "emp.VacationHours", kind: number, say: [vacation hours]}
  # promotions
  special_offer:   {node: offer, sql: "offer.Description", say: [promotion, special offer, discount]}
  offer_type:      {node: offer, sql: "offer.Type", say: [promotion type, discount type]}
  # purchasing
  vendor:          {node: vendor, sql: "vendor.Name", say: [vendor, supplier]}
  vendor_rating:   {node: vendor, sql: "vendor.CreditRating", say: [credit rating, vendor rating], decode: {1: Superior, 2: Excellent, 3: Above average, 4: Average, 5: Below average}}
  po_status:       {node: poh, sql: "poh.Status", say: [purchase order status], decode: {1: Pending, 2: Approved, 3: Rejected, 4: Complete}}
  # manufacturing and stock
  scrap_reason:    {node: scrap, sql: "scrap.Name", say: [scrap reason, failure reason]}
  location:        {node: loc, sql: "loc.Name", say: [location, warehouse location]}
  # ---- added for full coverage (round 3) ----
  # kind: text = free text or identifiers: shown and searched with "like", never grouped or matched as values.
  # products
  size:            {node: prod, sql: "prod.Size", say: [size]}
  size_unit:       {node: um_size, sql: "um_size.Name", say: [size unit]}
  weight_unit:     {node: um_weight, sql: "um_weight.Name", say: [weight unit]}
  safety_stock:    {node: prod, sql: "prod.SafetyStockLevel", kind: number, say: [safety stock level, minimum stock]}
  reorder_point:   {node: prod, sql: "prod.ReorderPoint", kind: number, say: [reorder point]}
  sell_start_date: {node: prod, sql: "prod.SellStartDate::date", kind: date, say: [sell start date, launch date, date first sold]}
  sell_end_date:   {node: prod, sql: "prod.SellEndDate::date", kind: date, say: [sell end date, date it stopped selling]}
  discontinued_date: {node: prod, sql: "prod.DiscontinuedDate::date", kind: date, say: [discontinued date]}
  photo_file:      {node: prod_photo, sql: "prod_photo.LargePhotoFileName", kind: text, say: [photo file, picture file name]}
  thumbnail_file:  {node: prod_photo, sql: "prod_photo.ThumbnailPhotoFileName", kind: text, say: [thumbnail file]}
  model_summary:   {node: model_info, sql: "model_info.Summary", kind: text, say: [model summary, catalog summary]}
  warranty:        {node: model_info, sql: "model_info.WarrantyPeriod", say: [warranty, warranty period]}
  maintenance_years: {node: model_info, sql: "model_info.MaintenanceYears", say: [maintenance contract length]}
  product_description: {node: model_desc_en, sql: "model_desc_en.Description", kind: text, say: [description, product description]}
  description:     {node: pdesc, sql: "pdesc.Description", kind: text, say: [description text, translated description]}
  language:        {node: culture, sql: "culture.Name", say: [language, culture]}
  # orders
  order_number:    {node: soh, sql: "soh.SalesOrderID", kind: number, say: [order number, sales order number]}
  order_status:    {node: soh, sql: "soh.Status", say: [order status], decode: {1: In process, 2: Approved, 3: Backordered, 4: Rejected, 5: Shipped, 6: Cancelled}}
  order_due_date:  {node: soh, sql: "soh.DueDate::date", kind: date, say: [due date]}
  order_ship_date: {node: soh, sql: "soh.ShipDate::date", kind: date, say: [ship date, shipping date]}
  order_revision:  {node: soh, sql: "soh.RevisionNumber", kind: number, say: [order revision number]}
