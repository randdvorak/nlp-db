  territory_country: ['in country {v}']
  manager: ['who report to {v}', 'managed by {v}', 'reporting to {v}', 'under {v}']
  assembly: ['that go into {v}', 'used in {v}', 'in the {v} assembly']
  buyer: ['placed by {v}', 'bought by {v}', 'handled by buyer {v}']
  sales_reason: ['because of {v}', 'citing {v}', 'where the reason was {v}']
  card_type: ['paid with {v}', 'on {v} cards', 'with a {v} card']
  currency: ['in {v}', 'paid in {v}', 'for the {v}']
  customer_city: ['from customers in {v}', 'for customers living in {v}']
  customer_state: ['from customers in {v}', 'for customers in {v}']
  customer_country: ['from customers in {v}', 'for customers based in {v}']
  vendor_city: ['from vendors in {v}', 'for suppliers in {v}']
  vendor_state: ['from vendors in {v}', 'for suppliers based in {v}']
