# Yes/no conditions people say in words.
flags:
  online:            {node: soh, sql: "soh.OnlineOrderFlag", say: [online, web orders, internet sales]}
  reseller:          {node: soh, sql: "NOT soh.OnlineOrderFlag", say: [reseller, through sales reps, store orders]}
  discounted:        {node: sod, sql: "sod.UnitPriceDiscount > 0", say: [discounted, sold on discount]}
  currently_sold:    {node: prod, sql: "prod.SellEndDate IS NULL", say: [current products, still sold, active products]}
  no_longer_sold:    {node: prod, sql: "prod.SellEndDate IS NOT NULL", say: [discontinued, no longer sold]}
  salable:           {node: prod, sql: "prod.FinishedGoodsFlag", say: [finished goods, salable products]}
  made_in_house:     {node: prod, sql: "prod.MakeFlag", say: [manufactured, made in-house]}
  bought_in:         {node: prod, sql: "NOT prod.MakeFlag", say: [purchased parts, bought in]}
  store_customer:    {node: cust, sql: "cust.StoreID IS NOT NULL", say: [store customers, resellers, business customers]}
  individual_customer: {node: cust, sql: "cust.StoreID IS NULL", say: [individual customers, consumers, retail customers]}
  salaried:          {node: emp, sql: "emp.SalariedFlag", say: [salaried]}
  hourly:            {node: emp, sql: "NOT emp.SalariedFlag", say: [hourly]}
  preferred_vendor:  {node: vendor, sql: "vendor.PreferredVendorStatus", say: [preferred vendors]}
  active_vendor:     {node: vendor, sql: "vendor.ActiveFlag", say: [active vendors]}
  has_scrap:         {node: wo, sql: "wo.ScrappedQty > 0", say: [with scrap, had failures]}
  has_rejects:       {node: pod, sql: "pod.RejectedQty > 0", say: [with rejected items]}
  # ---- added for full coverage (round 3) ----
  shipped_late:      {node: soh, sql: "soh.ShipDate > soh.DueDate", say: [shipped late, late orders]}
  foreign_currency:  {node: soh, sql: "soh.CurrencyRateID IS NOT NULL", say: [paid in a foreign currency]}
  paid_by_card:      {node: soh, sql: "soh.CreditCardID IS NOT NULL", say: [paid by credit card]}
  active_offer:      {node: offer, sql: "CURRENT_DATE BETWEEN offer.StartDate AND offer.EndDate", say: [current promotions, running promotions]}
  current_employee:  {node: emp, sql: "emp.CurrentFlag", say: [current employees, active staff]}
  homeowner:         {node: cust_demo, sql: "cust_demo.HomeOwnerFlag = '1'", say: [homeowners, own their home]}
  hired_candidate:   {node: jc, sql: "jc.BusinessEntityID IS NOT NULL", say: [hired candidates, candidates we hired]}
  current_assignment: {node: sth, sql: "sth.EndDate IS NULL", say: [current territory assignments]}
  past_department:   {node: edh_all, sql: "edh_all.EndDate IS NOT NULL", say: [previous departments, departments they left]}
  current_bom:       {node: bom, sql: "bom.EndDate IS NULL", say: [current components, components still in use]}
  current_cost:      {node: pch, sql: "pch.EndDate IS NULL", say: [current cost]}
  current_price:     {node: plph, sql: "plph.EndDate IS NULL", say: [current price]}
  archived:          {node: th, sql: "th.Archived", say: [archived transactions, older transactions]}
  late_work_order:   {node: wo, sql: "wo.EndDate > wo.DueDate", say: [finished late, late work orders]}
  delayed_operation: {node: wor, sql: "wor.ActualEndDate > wor.ScheduledEndDate", say: [delayed operations, behind schedule]}
  is_folder:         {node: doc, sql: "doc.FolderFlag", say: [folders]}
  is_file:           {node: doc, sql: "NOT doc.FolderFlag", say: [files, actual documents]}
  has_instructions:  {node: pmodel, sql: "pmodel.Instructions IS NOT NULL", say: [with manufacturing instructions]}
  has_catalog_description: {node: pmodel, sql: "pmodel.CatalogDescription IS NOT NULL", say: [with a catalog description]}
  primary_address:   {node: addrtype, sql: "addrtype.Name IN ('Primary', 'Main Office', 'Home')", say: [main addresses]}

# Time words, matching the training data conventions (see make_dataset.py SYSTEM prompt).
# {d} is the fact's date column. "last X" = previous calendar X; "past N X" = rolling window ending today.
time:
  grains:
    year:    "EXTRACT(YEAR FROM {d})::int"
    quarter: "EXTRACT(QUARTER FROM {d})::int"
    month:   "DATE_TRUNC('month', {d})::date"
    day:     "{d}::date"
  periods:
    today:        "{d} >= CURRENT_DATE AND {d} < CURRENT_DATE + 1"
    this_month:   "{d} >= DATE_TRUNC('month', CURRENT_DATE) AND {d} < CURRENT_DATE + 1"
    last_month:   "{d} >= DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '1 month' AND {d} < DATE_TRUNC('month', CURRENT_DATE)"
    this_quarter: "{d} >= DATE_TRUNC('quarter', CURRENT_DATE) AND {d} < CURRENT_DATE + 1"
    last_quarter: "{d} >= DATE_TRUNC('quarter', CURRENT_DATE) - INTERVAL '3 months' AND {d} < DATE_TRUNC('quarter', CURRENT_DATE)"
    this_year:    "{d} >= DATE_TRUNC('year', CURRENT_DATE) AND {d} < CURRENT_DATE + 1"
    last_year:    "{d} >= DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year' AND {d} < DATE_TRUNC('year', CURRENT_DATE)"
    past_days:    "{d} >= CURRENT_DATE - INTERVAL '{n} days' AND {d} < CURRENT_DATE + 1"
    past_months:  "{d} >= CURRENT_DATE - INTERVAL '{n} months' AND {d} < CURRENT_DATE + 1"
    year:         "{d} >= DATE '{n}-01-01' AND {d} < DATE '{n}-01-01' + INTERVAL '1 year'"
    between:      "{d} >= DATE '{from}' AND {d} < DATE '{to}' + 1"


# The fixed answers for questions the database cannot answer. A plan {"not_tracked": reason}
# must use one of these; aq rejects a made-up reason and asks the model again for a real query.
not_tracked:
  - "it records salaried or hourly pay, not full-time or part-time status"
  - "it has no employee performance ratings"
  - "it has no product returns or refunds"
  - "it has no customer satisfaction or complaint data"
  - "it has no website traffic data"
  - "it has no marketing spend or budgets"
  - "it records remaining sick leave and vacation hours, not absences or overtime"
  - "it records ship dates, not delivery dates"
  - "it has no competitor data"
  - "it has no weather data"
  - "it has no share price or financial market data"
  - "it has no training or certification records"
  - "it has no forecasts or budgets"
  - "it has no operating expenses such as rent or utilities"
  - "it has no customer churn or account closures"
  - "it has no store visitor counts"
  - "it does not record where employees work from"
  - "it has no social media data"
  - "it has no support tickets"
  - "it has no record of languages employees speak"
  - "national ID numbers are withheld for privacy"
  - "card numbers are withheld for privacy"
  - "passwords are withheld for security"
  - "the question is not about the AdventureWorks data"

# Columns deliberately left out of the catalog, with the reason. coverage.py reports any
# column that is neither used by the catalog nor listed here. "*.Col" applies to every table.
excluded:
  "*.rowguid":                         replication id, no business meaning
  "*.ModifiedDate":                    row edit timestamp, no business meaning
  Person.Password:                     password hashes and salts (security)
  Person.BusinessEntity:               ids only; the people, stores and vendors tables carry the meaning
  HumanResources.Employee.NationalIDNumber: national ID numbers (sensitive)
  Sales.CreditCard.CardNumber:         card numbers (sensitive)
  Sales.CreditCard.ExpMonth:           card expiry (sensitive)
  Sales.CreditCard.ExpYear:            card expiry (sensitive)
  Sales.SalesOrderHeader.CreditCardApprovalCode: payment approval codes (sensitive)
  Production.ProductPhoto.ThumbNailPhoto: image bytes
  Production.ProductPhoto.LargePhoto:  image bytes
  Production.Document.Document:        file bytes (the title, file name and summary are covered)
  Production.Illustration.Diagram:     vector drawing markup
  Production.ProductModel.Instructions: manufacturing instruction text (XML); only whether a model has them is covered
  Person.Person.AdditionalContactInfo: free-form XML on 10 people
  Person.Person.NameStyle:             always 0 (Western name order)
  Person.Address.SpatialLocation:      encoded map coordinates
  Person.StateProvince.IsOnlyStateProvinceFlag: technical flag
  Person.StateProvince.TerritoryID:    the order's own territory is used instead
  HumanResources.EmployeePayHistory.PayFrequency: same as the current pay frequency (pay_frequency)
  Production.ProductProductPhoto.primary: every product has one primary photo
  Production.TransactionHistory.TransactionID: row id
  Production.TransactionHistoryArchive.TransactionID: row id
  Sales.SalesOrderDetail.SalesOrderDetailID: row id
  Purchasing.PurchaseOrderDetail.PurchaseOrderDetailID: row id
  Production.BillOfMaterials.BillOfMaterialsID: row id
  Sales.ShoppingCartItem.ShoppingCartItemID: row id
  HumanResources.JobCandidate.JobCandidateID: row id
  Production.Document.DocumentNode:    tree position; the folder is covered
  Sales.SalesTaxRate.SalesTaxRateID:   row id
  Person.EmailAddress.EmailAddressID:  row id (one email per person)
  Production.ProductReview.ProductReviewID: row id
