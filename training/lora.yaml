# MLX LoRA settings for the plan model (scripts/train.sh adds --model, --data, --adapter-path, --iters).
# These trained the AdventureWorks round 5 model: Qwen2.5-Coder-1.5B-Instruct, about 16,000 pairs,
# batch 4, 6000 iterations (about 1.6 epochs), from the base model.
train: true
fine_tune_type: lora
num_layers: -1
batch_size: 4
iters: 6000
val_batches: 50
steps_per_report: 100
steps_per_eval: 1000
save_every: 1000
max_seq_length: 512
mask_prompt: true
grad_checkpoint: false
lora_parameters:
  rank: 16
  scale: 4.0
  dropout: 0.0
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 0.0
  arguments: [1.0e-4, 6000, 1.0e-6]
