  territory_group: ['in {v}', 'for {v}', 'in {v}', 'within {v}', 'across {v}']
  ship_country: ['shipped to {v}', 'delivered to {v}', 'going to {v}', 'in {v}', 'for {v}', 'in {v}', 'within {v}']
  ship_state: ['shipped to {v}', 'delivered to {v}', 'in {v}', 'for {v}', 'in {v}', 'within {v}']
  ship_city: ['shipped to {v}', 'in {v}', 'delivered to {v}']
  category: ['for {v}', 'in the {v} category', 'for {v} products', 'in {v}']
  subcategory: ['for {v}', 'for {v} products', 'in the {v} subcategory']
